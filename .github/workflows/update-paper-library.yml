name: Update Paper Library data

on:
  schedule:
    # 10:30 Beijing time on the first day of every month. GitHub Actions cron is UTC.
    - cron: "30 2 1 * *"
  workflow_dispatch:
    inputs:
      backfill:
        description: "Fetch all records from 2014 instead of recent updates"
        required: true
        type: choice
        options:
          - "false"
          - "true"
        default: "false"
      refresh_tracks_only:
        description: "Only refresh official proceedings/program track mappings for existing records"
        required: true
        type: choice
        options:
          - "false"
          - "true"
        default: "false"
      venues:
        description: "Optional comma-separated conference ids, e.g. HPCA,ISCA"
        required: false
        type: string
        default: ""
      start_year:
        description: "Start year for backfill or track refresh"
        required: false
        type: string
        default: "2014"
      end_year:
        description: "Optional end year; defaults to current year in the script"
        required: false
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: paper-library-data
  cancel-in-progress: false

jobs:
  update-library:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch paper library
        env:
          BACKFILL: ${{ github.event.inputs.backfill || 'false' }}
          REFRESH_TRACKS_ONLY: ${{ github.event.inputs.refresh_tracks_only || 'false' }}
          VENUES: ${{ github.event.inputs.venues || '' }}
          START_YEAR: ${{ github.event.inputs.start_year || '2014' }}
          END_YEAR: ${{ github.event.inputs.end_year || '' }}
        run: |
          args=()
          if [ -n "$VENUES" ]; then
            args+=(--venues "$VENUES")
          fi
          if [ -n "$END_YEAR" ]; then
            args+=(--end-year "$END_YEAR")
          fi

          if [ "$REFRESH_TRACKS_ONLY" = "true" ]; then
            python paper-review/scripts/fetch_library.py --refresh-official-tracks-only --start-year "$START_YEAR" --official-tracks refresh "${args[@]}"
          elif [ "$BACKFILL" = "true" ]; then
            python paper-review/scripts/fetch_library.py --mode all --start-year "$START_YEAR" --conference-providers crossref --official-tracks auto "${args[@]}"
          else
            python paper-review/scripts/fetch_library.py --mode recent --recent-years 2 --recent-months 4 --conference-providers crossref --official-tracks auto "${args[@]}"
          fi

      - name: Commit library updates
        run: |
          if [ -n "$(git status --porcelain paper-review/data/library)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add paper-review/data/library
            git commit -m "Update Paper Library data"
            git push
          fi
