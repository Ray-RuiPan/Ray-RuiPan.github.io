name: Update Paper Review data

on:
  schedule:
    # 10:00 Beijing time, every day. GitHub Actions cron is UTC.
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: paper-review-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch arXiv papers
        run: python paper-review/scripts/fetch_arxiv.py

      - name: Commit data updates
        run: |
          if [ -n "$(git status --porcelain paper-review/data)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add paper-review/data
            git commit -m "Update Paper Review data"
            git push
          fi
