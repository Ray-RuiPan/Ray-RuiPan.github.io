<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Paper Review Library</title>
    <meta
      name="description"
      content="Conference proceedings and journal papers since 2014 for computer architecture, systems, PL, EDA, and networking."
    />
    <link rel="canonical" href="https://ray-ruipan.github.io/paper-review/library/" />
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow">Proceedings & Journals</p>
        <h1>论文库</h1>
      </div>
      <div class="topbar-actions">
        <a class="nav-link" href="../">arXiv</a>
        <a class="nav-link" href="../saved/">收藏</a>
        <span id="statusText" class="status-text">加载中</span>
        <button id="reloadButton" class="icon-button" type="button" title="重新载入" aria-label="重新载入">
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path d="M20 12a8 8 0 1 1-2.34-5.66" />
            <path d="M20 4v6h-6" />
          </svg>
        </button>
      </div>
    </header>

    <main class="page-shell library-shell">
      <aside class="sidebar library-sidebar" aria-label="论文库导航">
        <section class="filter-block">
          <label for="searchInput">搜索</label>
          <input id="searchInput" type="search" placeholder="标题、作者、DOI、track" autocomplete="off" />
        </section>

        <section class="filter-block">
          <span class="filter-heading">会议 / 期刊</span>
          <div id="venueNav" class="venue-nav"></div>
        </section>
      </aside>

      <section class="content library-content">
        <div class="summary-row library-summary" aria-label="Summary">
          <div class="metric">
            <span id="totalCount">0</span>
            <small>论文总数</small>
          </div>
          <div class="metric">
            <span id="venueCount">0</span>
            <small>会议/期刊</small>
          </div>
          <div class="metric">
            <span id="yearCount">0</span>
            <small>年份/月度</small>
          </div>
          <div class="metric">
            <span id="trackCount">0</span>
            <small>Track</small>
          </div>
        </div>

        <div id="libraryNote" class="empty-state library-note" hidden></div>

        <section id="overviewSection" class="library-section">
          <div class="section-heading">
            <div>
              <p class="eyebrow">Navigation</p>
              <h2>从左侧目录选择</h2>
            </div>
            <button id="clearRouteButton" class="text-button" type="button">总览</button>
          </div>
          <div id="venueGrid" class="venue-grid"></div>
        </section>

        <section id="detailSection" class="library-section" hidden>
          <div class="section-heading">
            <div>
              <p id="detailEyebrow" class="eyebrow">Venue</p>
              <h2 id="detailTitle"></h2>
              <p id="detailMeta" class="section-subtitle"></p>
            </div>
            <button id="backButton" class="text-button" type="button">返回总览</button>
          </div>

          <div id="yearPills" class="year-pills" aria-label="年份"></div>

          <div class="track-panel">
            <div class="track-panel-heading">
              <h3>Track 汇总</h3>
              <span id="visibleCount">0</span>
            </div>
            <div id="trackSummary" class="track-summary"></div>
          </div>

          <div id="paperList" class="paper-list" aria-live="polite"></div>
          <div id="emptyState" class="empty-state" hidden>没有匹配的论文</div>
        </section>
      </section>
    </main>

    <footer class="footer">
      Metadata is collected from DBLP and Crossref where available.
    </footer>

    <script src="./library.js" defer></script>
  </body>
</html>
